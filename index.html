<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mixture Explorer: Macro to Micro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom slider styling for a better look */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            margin-top: -8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 8px;
            cursor: pointer;
            background: #334155;
            border-radius: 4px;
        }
        input[type=range]:focus {
            outline: none;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen overflow-hidden font-sans selection:bg-blue-500 selection:text-white relative select-none">

    <!-- Fullscreen Canvas -->
    <canvas id="simCanvas" class="absolute top-0 left-0 w-full h-full block cursor-grab active:cursor-grabbing"></canvas>

    <!-- Floating UI Panel -->
    <main class="absolute top-4 left-4 w-80 sm:w-96 bg-slate-800/80 backdrop-blur-md p-5 rounded-2xl shadow-2xl border border-slate-700/50 flex flex-col gap-6 pointer-events-auto">
        
        <header>
            <h1 class="text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-fuchsia-400 mb-1">
                Mixture Explorer
            </h1>
            <p class="text-slate-300 text-sm leading-snug">
                Zoom to see how atoms behave at the macro vs micro scale.
            </p>
        </header>

        <!-- Controls -->
        <div class="flex flex-col gap-4">
            
            <!-- Type Toggle -->
            <div>
                <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 block">Matter Type</label>
                <div class="grid grid-cols-2 gap-2">
                    <button id="btn-element" class="py-1.5 px-3 rounded-md text-sm font-bold transition-all duration-200 bg-cyan-600/90 text-white shadow">Element</button>
                    <button id="btn-compound" class="py-1.5 px-3 rounded-md text-sm font-bold transition-all duration-200 bg-slate-700 text-slate-400 hover:text-slate-200">Compound</button>
                    <button id="btn-homo" class="py-1.5 px-3 rounded-md text-sm font-bold transition-all duration-200 bg-slate-700 text-slate-400 hover:text-slate-200">Homogeneous</button>
                    <button id="btn-hetero" class="py-1.5 px-3 rounded-md text-sm font-bold transition-all duration-200 bg-slate-700 text-slate-400 hover:text-slate-200">Heterogeneous</button>
                </div>
            </div>

            <!-- Zoom Slider -->
            <div>
                <div class="flex justify-between mb-1.5">
                    <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Zoom</label>
                    <span id="zoom-label" class="text-xs font-mono text-cyan-300">1.0x</span>
                </div>
                <input type="range" id="zoom-slider" min="1" max="40" step="0.1" value="1" class="w-full accent-cyan-500 cursor-pointer">
            </div>

            <!-- Educational Info Box -->
            <div id="info-box" class="bg-slate-900/80 p-3 rounded-lg border border-cyan-700/50 text-sm text-slate-300 shadow-inner min-h-[80px]">
                <strong>Element (Pure):</strong> Made of only one type of atom. At the macro scale, it appears as a single, uniform substance.
            </div>
            
            <!-- Legend overlay -->
            <div class="bg-slate-900/50 p-3 rounded-lg border border-slate-700/50 flex flex-col gap-1.5">
                <div class="flex items-center gap-2">
                    <div class="w-3 h-3 rounded-full bg-cyan-500"></div>
                    <span class="text-xs font-semibold text-slate-300">Atom A (Cyan)</span>
                </div>
                <div class="flex items-center gap-2">
                    <div class="w-3 h-3 rounded-full bg-fuchsia-500"></div>
                    <span class="text-xs font-semibold text-slate-300">Atom B (Magenta)</span>
                </div>
                <div class="flex items-center gap-2 mt-1">
                    <div class="w-3 h-3 rounded-full bg-[#6f7ee1] shadow-[0_0_8px_rgba(111,126,225,0.5)]"></div>
                    <span class="text-xs font-semibold text-slate-300">Macro Blended (Purple)</span>
                </div>
            </div>

        </div>
        
        <div class="text-[11px] text-slate-400 flex items-center gap-1.5 mt-2">
            <svg class="w-4 h-4 shrink-0 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"></path></svg>
            Drag to pan, Scroll to zoom
        </div>
    </main>

    <script>
        // --- Constants & Config ---
        const GRID_SIZE = 300;
        const COLOR_A = [6, 182, 212];   // Cyan
        const COLOR_B = [217, 70, 239];  // Magenta

        const explanations = {
            'element': "<strong>Element (Pure):</strong> Made of only one type of atom. At the macro scale, it appears as a single, uniform substance.",
            'compound': "<strong>Compound (Pure):</strong> Two or more types of atoms chemically bonded (paired) in a repeating pattern. It also appears uniform at the macro scale.",
            'homo': "<strong>Homogeneous Mixture:</strong> Different atoms are not bonded, but are mixed completely evenly. It looks uniform to the naked eye.",
            'hetero': "<strong>Heterogeneous Mixture:</strong> Different atoms are not bonded and are clumped together. You can clearly see the different parts even when you zoom out."
        };

        // --- State Management ---
        const state = {
            type: 'element', 
            zoom: 1, 
            grid: new Uint8Array(GRID_SIZE * GRID_SIZE),
            smoothedGrid: new Float32Array(GRID_SIZE * GRID_SIZE),
            panX: GRID_SIZE / 2, // Center of grid
            panY: GRID_SIZE / 2,
            width: window.innerWidth,
            height: window.innerHeight
        };

        // --- DOM Elements ---
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const btnElement = document.getElementById('btn-element');
        const btnCompound = document.getElementById('btn-compound');
        const btnHomo = document.getElementById('btn-homo');
        const btnHetero = document.getElementById('btn-hetero');
        const slider = document.getElementById('zoom-slider');
        const zoomLabel = document.getElementById('zoom-label');
        const infoBox = document.getElementById('info-box');
        
        // Offscreen canvas for optimized zoomed-out rendering
        const offscreenCanvas = document.createElement('canvas');
        offscreenCanvas.width = GRID_SIZE;
        offscreenCanvas.height = GRID_SIZE;
        const offscreenCtx = offscreenCanvas.getContext('2d', { alpha: false });
        const imgData = offscreenCtx.createImageData(GRID_SIZE, GRID_SIZE);

        let lastBlendAmount = -1;
        let forceUpdateImgData = true;

        // --- Resizing ---
        function resize() {
            state.width = window.innerWidth;
            state.height = window.innerHeight;
            canvas.width = state.width;
            canvas.height = state.height;
            requestAnimationFrame(render);
        }
        window.addEventListener('resize', resize);

        // --- Grid Generation ---
        function generateGrid() {
            if (state.type === 'element') {
                for (let i = 0; i < GRID_SIZE * GRID_SIZE; i++) {
                    state.grid[i] = 0;
                }
            } else if (state.type === 'compound') {
                for (let y = 0; y < GRID_SIZE; y++) {
                    for (let x = 0; x < GRID_SIZE; x++) {
                        state.grid[y * GRID_SIZE + x] = (x % 2 === 0) ? 0 : 1;
                    }
                }
            } else if (state.type === 'homo') {
                for (let i = 0; i < GRID_SIZE * GRID_SIZE; i++) {
                    state.grid[i] = Math.random() < 0.5 ? 0 : 1;
                }
            } else if (state.type === 'hetero') {
                // Initial 50/50 noise
                for (let i = 0; i < GRID_SIZE * GRID_SIZE; i++) {
                    state.grid[i] = Math.random() < 0.5 ? 0 : 1;
                }
                // Cellular Automaton for Heterogeneous clumps
                let tempGrid = new Uint8Array(GRID_SIZE * GRID_SIZE);
                for (let pass = 0; pass < 5; pass++) {
                    for (let y = 0; y < GRID_SIZE; y++) {
                        for (let x = 0; x < GRID_SIZE; x++) {
                            let sum = 0;
                            let count = 0;
                            for (let dy = -2; dy <= 2; dy++) {
                                for (let dx = -2; dx <= 2; dx++) {
                                    let nx = x + dx;
                                    let ny = y + dy;
                                    if (nx >= 0 && nx < GRID_SIZE && ny >= 0 && ny < GRID_SIZE) {
                                        sum += state.grid[ny * GRID_SIZE + nx];
                                        count++;
                                    }
                                }
                            }
                            tempGrid[y * GRID_SIZE + x] = (sum / count) > 0.5 ? 1 : 0;
                        }
                    }
                    state.grid.set(tempGrid);
                }
            }

            computeSmoothedGrid();
            forceUpdateImgData = true;
            render();
        }

        // --- Optical Blending Math (Separable Box Blur) ---
        function computeSmoothedGrid() {
            const R = 12; // Blur radius
            let temp = new Float32Array(GRID_SIZE * GRID_SIZE);
            let current = new Float32Array(state.grid);
            
            // 2-Pass Box Blur for smooth heterogeneous edges
            for (let pass = 0; pass < 2; pass++) {
                // Horizontal pass
                for (let y = 0; y < GRID_SIZE; y++) {
                    for (let x = 0; x < GRID_SIZE; x++) {
                        let sum = 0;
                        let count = 0;
                        for (let dx = -R; dx <= R; dx++) {
                            let nx = x + dx;
                            if (nx >= 0 && nx < GRID_SIZE) {
                                sum += current[y * GRID_SIZE + nx];
                                count++;
                            }
                        }
                        temp[y * GRID_SIZE + x] = sum / count;
                    }
                }
                
                // Vertical pass
                for (let y = 0; y < GRID_SIZE; y++) {
                    for (let x = 0; x < GRID_SIZE; x++) {
                        let sum = 0;
                        let count = 0;
                        for (let dy = -R; dy <= R; dy++) {
                            let ny = y + dy;
                            if (ny >= 0 && ny < GRID_SIZE) {
                                sum += temp[ny * GRID_SIZE + x];
                                count++;
                            }
                        }
                        current[y * GRID_SIZE + x] = sum / count;
                    }
                }
            }

            // Finalize values
            for (let i = 0; i < GRID_SIZE * GRID_SIZE; i++) {
                if (state.type === 'element') {
                    state.smoothedGrid[i] = 0; 
                } else if (state.type === 'homo' || state.type === 'compound') {
                    // REQUIREMENT: Must render as perfectly solid macro.
                    state.smoothedGrid[i] = 0.5; 
                } else {
                    // Heterogeneous keeps the beautifully blurred clumps
                    state.smoothedGrid[i] = current[i]; 
                }
            }
        }

        // --- Rendering ---
        function updateImageData(blendAmount) {
            const data = imgData.data;
            for (let i = 0; i < GRID_SIZE * GRID_SIZE; i++) {
                const baseVal = state.grid[i];
                const smoothVal = state.smoothedGrid[i];
                // Interpolate between discrete value and smoothed value based on zoom
                const val = baseVal + (smoothVal - baseVal) * blendAmount;

                // Color mix: Cyan (0) to Magenta (1)
                const r = COLOR_A[0] + (COLOR_B[0] - COLOR_A[0]) * val;
                const g = COLOR_A[1] + (COLOR_B[1] - COLOR_A[1]) * val;
                const b = COLOR_A[2] + (COLOR_B[2] - COLOR_A[2]) * val;

                const idx = i * 4;
                data[idx] = r;
                data[idx+1] = g;
                data[idx+2] = b;
                data[idx+3] = 255;
            }
            offscreenCtx.putImageData(imgData, 0, 0);
            lastBlendAmount = blendAmount;
            forceUpdateImgData = false;
        }

        function render() {
            ctx.fillStyle = '#020617'; // slate-950 background
            ctx.fillRect(0, 0, state.width, state.height);

            const baseScale = Math.min(state.width, state.height) * 0.9 / GRID_SIZE;
            const cellSize = baseScale * state.zoom;
            
            const cx = state.width / 2;
            const cy = state.height / 2;

            // Combine zoom level to determine blending.
            // zoom <= 3 is 1.0 (fully blended), zoom >= 10 is 0.0
            let blendAmount = Math.max(0, Math.min(1, 1 - (state.zoom - 3) / 7));
            
            if (forceUpdateImgData || Math.abs(blendAmount - lastBlendAmount) > 0.005) {
                updateImageData(blendAmount);
            }

            const drawW = GRID_SIZE * cellSize;
            const drawH = GRID_SIZE * cellSize;
            const drawX = cx - state.panX * cellSize;
            const drawY = cy - state.panY * cellSize;

            // 1. Draw the continuous macroscopic field
            ctx.imageSmoothingEnabled = false; 
            ctx.globalAlpha = blendAmount;
            if (blendAmount > 0) {
                ctx.drawImage(offscreenCanvas, drawX, drawY, drawW, drawH);
            }

            // 2. Draw distinct microscopic atoms
            if (blendAmount < 1.0 && state.zoom >= 2) {
                ctx.globalAlpha = 1.0 - blendAmount; 
                
                const cellsOnScreenX = state.width / cellSize;
                const cellsOnScreenY = state.height / cellSize;

                const startX = Math.max(0, Math.floor(state.panX - cellsOnScreenX / 2));
                const endX = Math.min(GRID_SIZE, Math.ceil(state.panX + cellsOnScreenX / 2));
                const startY = Math.max(0, Math.floor(state.panY - cellsOnScreenY / 2));
                const endY = Math.min(GRID_SIZE, Math.ceil(state.panY + cellsOnScreenY / 2));

                const radius = (cellSize / 2) * 0.85; 
                
                ctx.fillStyle = `rgb(${COLOR_A.join(',')})`;
                ctx.beginPath();
                for (let y = startY; y < endY; y++) {
                    for (let x = startX; x < endX; x++) {
                        if (state.grid[y * GRID_SIZE + x] === 0) {
                            let px = cx + (x - state.panX) * cellSize + cellSize/2;
                            let py = cy + (y - state.panY) * cellSize + cellSize/2;
                            if (state.type === 'compound') px += radius * 0.4; // Shift right to pair up
                            ctx.moveTo(px + radius, py);
                            ctx.arc(px, py, radius, 0, Math.PI * 2);
                        }
                    }
                }
                ctx.fill();

                ctx.fillStyle = `rgb(${COLOR_B.join(',')})`;
                ctx.beginPath();
                for (let y = startY; y < endY; y++) {
                    for (let x = startX; x < endX; x++) {
                        if (state.grid[y * GRID_SIZE + x] === 1) {
                            let px = cx + (x - state.panX) * cellSize + cellSize/2;
                            let py = cy + (y - state.panY) * cellSize + cellSize/2;
                            if (state.type === 'compound') px -= radius * 0.4; // Shift left to pair up
                            ctx.moveTo(px + radius, py);
                            ctx.arc(px, py, radius, 0, Math.PI * 2);
                        }
                    }
                }
                ctx.fill();
            }
            
            ctx.globalAlpha = 1.0; // Reset alpha
        }

        // --- Interaction & Events ---
        let isDragging = false;
        let lastMouseX, lastMouseY;

        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const dx = e.clientX - lastMouseX;
            const dy = e.clientY - lastMouseY;
            
            const baseScale = Math.min(state.width, state.height) * 0.9 / GRID_SIZE;
            const cellSize = baseScale * state.zoom;

            // Update pan in grid units
            state.panX -= dx / cellSize;
            state.panY -= dy / cellSize;
            
            // Constrain
            state.panX = Math.max(0, Math.min(GRID_SIZE, state.panX));
            state.panY = Math.max(0, Math.min(GRID_SIZE, state.panY));

            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
            requestAnimationFrame(render);
        });

        window.addEventListener('mouseup', () => isDragging = false);
        window.addEventListener('mouseleave', () => isDragging = false);

        // Zoom to Cursor
        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const oldZoom = state.zoom;
            const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
            let newZoom = Math.max(1, Math.min(40, state.zoom * zoomFactor));
            
            if (newZoom !== oldZoom) {
                // Calculate cursor position in grid units
                const baseScale = Math.min(state.width, state.height) * 0.9 / GRID_SIZE;
                const oldCellSize = baseScale * oldZoom;
                
                const cursorGridX = state.panX + (e.clientX - state.width / 2) / oldCellSize;
                const cursorGridY = state.panY + (e.clientY - state.height / 2) / oldCellSize;

                state.zoom = newZoom;
                slider.value = state.zoom;
                zoomLabel.textContent = state.zoom.toFixed(1) + 'x';
                
                // Adjust pan to zoom towards cursor
                const newCellSize = baseScale * state.zoom;
                state.panX = cursorGridX - (e.clientX - state.width / 2) / newCellSize;
                state.panY = cursorGridY - (e.clientY - state.height / 2) / newCellSize;
                
                state.panX = Math.max(0, Math.min(GRID_SIZE, state.panX));
                state.panY = Math.max(0, Math.min(GRID_SIZE, state.panY));

                requestAnimationFrame(render);
            }
        }, { passive: false });

        slider.addEventListener('input', (e) => {
            state.zoom = parseFloat(e.target.value);
            zoomLabel.textContent = state.zoom.toFixed(1) + 'x';
            requestAnimationFrame(render);
        });

        // Helper to update buttons
        function updateButtons(activeId) {
            const btns = {
                'btn-element': btnElement,
                'btn-compound': btnCompound,
                'btn-homo': btnHomo,
                'btn-hetero': btnHetero
            };
            for (let id in btns) {
                if (id === activeId) {
                    btns[id].className = "py-1.5 px-3 rounded-md text-sm font-bold transition-all duration-200 bg-cyan-600/90 text-white shadow";
                } else {
                    btns[id].className = "py-1.5 px-3 rounded-md text-sm font-bold transition-all duration-200 bg-slate-700 text-slate-400 hover:text-slate-200";
                }
            }
        }

        btnElement.addEventListener('click', () => {
            state.type = 'element';
            infoBox.innerHTML = explanations['element'];
            updateButtons('btn-element');
            generateGrid();
        });

        btnCompound.addEventListener('click', () => {
            state.type = 'compound';
            infoBox.innerHTML = explanations['compound'];
            updateButtons('btn-compound');
            generateGrid();
        });

        btnHomo.addEventListener('click', () => {
            state.type = 'homo';
            infoBox.innerHTML = explanations['homo'];
            updateButtons('btn-homo');
            generateGrid();
        });

        btnHetero.addEventListener('click', () => {
            state.type = 'hetero';
            infoBox.innerHTML = explanations['hetero'];
            updateButtons('btn-hetero');
            generateGrid();
        });

        // --- Init ---
        resize();
        generateGrid();
    </script>
</body>
</html>
